AWSTemplateFormatVersion: "2010-09-09"
Description: "Intent Classifier - EC2 in existing VPC/Subnet + new Security Group"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "Existing VPC ID (vpc-...)"

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Existing subnet ID (subnet-...) to launch EC2 into"

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Your existing EC2 key pair name"

  MyIpCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Your public IP in CIDR for SSH (recommended: x.x.x.x/32)"

  InstanceType:
    Type: String
    Default: "t3.small"
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: "EC2 instance type"

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: "Ubuntu 22.04 LTS AMI (from SSM Parameter Store)"

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Intent app SG: allow SSH + HTTP"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # SSH from your IP only (recommended)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
        # HTTP for the web app
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets you connect via SSM Session Manager (no SSH needed if you prefer)
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppInstanceRole

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      IamInstanceProfile: !Ref AppInstanceProfile
      Tags:
        - Key: Name
          Value: intent-classifier-ec2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          export APP_DIRECTORY="/opt/intent-hw-app"
          mkdir -p $APP_DIRECTORY
          cd $APP_DIRECTORY

          apt-get update -y
          apt install -y git python3 python3-pip nginx python3-venv

          git clone https://github.com/mpvkarthick/model-deployment-serving-vm-aws.git .

          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

          python3 model/train.py

          cat >/etc/systemd/system/intent_gunicorn.service <<'EOF'
          [Unit]
          Description=Gunicorn instance for Intent Classifier
          After=network.target

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/intent-hw-app
          Environment="PATH=/opt/intent-hw-app/venv/bin"
          ExecStart=/opt/intent-hw-app/venv/bin/gunicorn --workers 3 --bind 127.0.0.1:6000 wsgi:app
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/nginx/conf.d/intent_app.conf <<'EOF'
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:6000/predict;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_connect_timeout 60s;
                  proxy_read_timeout 120s;
              }
          }
          EOF

          if [ -L /etc/nginx/sites-enabled/default ] || [ -f /etc/nginx/sites-enabled/default ]; then
            rm -f /etc/nginx/sites-enabled/default || true
          fi

          systemctl daemon-reload
          systemctl enable intent_gunicorn
          systemctl start intent_gunicorn
          systemctl enable nginx
          systemctl restart nginx

Outputs:
  InstanceId:
    Value: !Ref AppInstance

  PublicIp:
    Description: "Public IP of the EC2 instance"
    Value: !GetAtt AppInstance.PublicIp

  AppURL:
    Description: "URL (after your nginx config points to your app)"
    Value: !Sub "http://${AppInstance.PublicDnsName}/"
